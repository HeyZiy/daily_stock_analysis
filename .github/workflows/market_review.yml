name: 大盘复盘

on:
  # 定时触发 - 每天北京时间 16:30 (UTC 08:30) 收盘后执行
  schedule:
    - cron: '30 8 * * 1-5'     # 周一到周五，UTC 08:30 = 北京时间 16:30

  # 手动触发
  workflow_dispatch:
    inputs:
      region:
        description: '市场地区'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - cn
          - us
          - both
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

# 并发控制：同一时间只运行一个复盘任务
concurrency:
  group: market-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      - name: 执行大盘复盘
        env:
          # ==========================================
          # 搜索引擎配置（至少配置一个，否则降级运行）
          # ==========================================
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS }}

          # ==========================================
          # AI 模型配置（未配置则跳过 LLM 分析）
          # ==========================================
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # ==========================================
          # 通知渠道
          # ==========================================
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'daily_stock_analysis股票分析助手' }}

          # ==========================================
          # 系统配置
          # ==========================================
          LOG_LEVEL: INFO
          MARKET_REVIEW_REGION: ${{ vars.MARKET_REVIEW_REGION || 'cn' }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || 'true' }}

        run: |
          echo "=========================================="
          echo "📈 大盘复盘"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"

          # 构建命令行参数
          ARGS=""

          if [ -n "${{ github.event.inputs.region }}" ]; then
            ARGS="$ARGS --region ${{ github.event.inputs.region }}"
            echo "🌐 指定地区: ${{ github.event.inputs.region }}"
          fi

          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            ARGS="$ARGS --force-run"
            echo "⚡ 已启用强制运行模式（跳过交易日检查）"
          fi

          python market_review.py $ARGS

      - name: 上传日志
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: market-review-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14

      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 复盘完成"
          echo "=========================================="
          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            echo "生成的报告:"
            ls -la reports/
          fi
          echo ""
          echo "📜 最近日志（最后 30 行）:"
          tail -30 logs/market_review_*.log 2>/dev/null || echo "无日志"
