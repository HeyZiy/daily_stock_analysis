name: ETF 每日分析

on:
  # 定时触发 - 每天北京时间 16:15 (UTC 08:15) 收盘后执行
  schedule:
    - cron: '15 8 * * 1-5'     # 周一到周五，UTC 08:15 = 北京时间 16:15
  
  # 手动触发
  workflow_dispatch:
    inputs:
      single_etf:
        description: '只分析单个ETF代码（留空则分析全部）'
        required: false
        default: ''
        type: string

# 并发控制：同一时间只运行一个ETF分析任务
concurrency:
  group: etf-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))  # 随机延迟0-60秒启动
      
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      - name: 执行ETF分析
        env:
          # ==========================================
          # 数据源
          # ==========================================
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

          # ==========================================
          # 通知渠道（可同时配置多个，全部推送）
          # ==========================================
          # 飞书
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 钉钉
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          # Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 邮件
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'ETF分析助手' }}
          
          # ==========================================
          # 系统配置
          # ==========================================
          LOG_LEVEL: INFO
          
        run: |
          echo "=========================================="
          echo "📊 ETF 分析"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          
          # 构建命令行参数
          ARGS=""
          if [ -n "${{ github.event.inputs.single_etf }}" ]; then
            ARGS="$ARGS --single ${{ github.event.inputs.single_etf }}"
            echo "🔍 只分析单个ETF: ${{ github.event.inputs.single_etf }}"
          fi
          
          # 执行分析
          python etf_analysis.py $ARGS --no-notify
      
      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: etf-analysis-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 分析完成"
          echo "=========================================="
          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            echo "生成的报告:"
            ls -la reports/
          else
            echo "⚠️ 未生成报告文件"
          fi
          echo ""
          if [ -f "logs/etf_analysis_$(date +%Y%m%d).log" ]; then
            echo "📜 最近日志（最后 30 行）:"
            tail -30 logs/etf_analysis_*.log 2>/dev/null || echo "无日志"
          fi
